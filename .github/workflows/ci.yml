name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run mypy
        run: python -m mypy .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run tests
        run: python -m unittest -q

      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Run Lua 5.1 differential tests
        run: python tools/differential_test.py --lua lua5.1

      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
